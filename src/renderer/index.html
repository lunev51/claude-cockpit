<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" />
  <title>Cockpit</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="./css/fonts.css" />
  <link rel="stylesheet" href="./css/app.css" />
  <!-- xterm.js — UMD-сборки, глобали window.Terminal, window.FitAddon,
       window.WebLinksAddon, window.SearchAddon, window.Unicode11Addon, window.WebglAddon,
       window.SerializeAddon -->
  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../../node_modules/@xterm/addon-search/lib/addon-search.js"></script>
  <script src="../../node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
  <script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="../../node_modules/@xterm/addon-serialize/lib/addon-serialize.js"></script>
</head>
<body>
  <div id="titlebar">
    <span class="dot"></span>
    <span id="titlebar-text">Cockpit</span>
    <span id="titlebar-sub"></span>
  </div>
  <div id="app">
    <div id="sidebar">
      <div id="tab-groups">
        <div class="sidebar-section wait hidden" data-group="waiting">Ждут тебя · <span class="count"></span></div>
        <div class="group-body" data-body="waiting"></div>
        <div class="sidebar-section hidden" data-group="working">Работают · <span class="count"></span></div>
        <div class="group-body" data-body="working"></div>
        <div class="sidebar-section hidden" data-group="done">Готово · <span class="count"></span></div>
        <div class="group-body" data-body="done"></div>
        <div class="sidebar-section hidden" data-group="trouble">Проблемы · <span class="count"></span></div>
        <div class="group-body" data-body="trouble"></div>
      </div>
      <div class="sidebar-footer">
        <!-- Task 3 фазы 5: кольца лимитов (5ч/неделя) — renderRings (rings.js)
             сама наполняет #limits при каждом usage:get/usage:update; клик по
             блоку пока просто форсит usage:refresh() (дашборд — Task 4). -->
        <div id="limits" tabindex="0" role="button" aria-label="Лимиты Claude — обновить"></div>
        <button class="sidebar-btn" id="btn-new-tab">+ Проект</button>
      </div>
    </div>
    <div id="main">
      <div id="terminal-host"></div>
      <div id="action-bar">
        <div id="action-commands"></div>
        <div id="action-right">
          <span id="limit-5h" title="5-часовое окно"></span>
        </div>
      </div>
      <div id="restore-overlay" class="hidden">
        <div class="restore-card">
          <div class="restore-title">Восстановить воркспейс?</div>
          <div id="restore-list"></div>
          <div class="restore-actions">
            <button class="sidebar-btn" id="btn-restore-all">Восстановить (Enter)</button>
            <button class="sidebar-btn" id="btn-restore-none">Начать пусто (Esc)</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Task 3 фазы 4 (peek): корень поповера — вне #sidebar/#main нарочно,
       чтобы position:fixed внутри позиционировался относительно окна целиком,
       не обрезаясь overflow:auto сайдбара. createPeek() сама наполняет/чистит
       этот контейнер (см. src/renderer/js/peek.js). -->
  <div id="peek-root"></div>
  <!-- Task 4 фазы 4 (палитра команд): тот же приём, что peek-root — корень
       вне #sidebar/#main, чтобы оверлей палитры накрывал окно целиком, а не
       обрезался overflow:auto сайдбара. createPalette() наполняет/чистит
       этот контейнер сама (см. src/renderer/js/palette.js). -->
  <div id="palette-root"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
