<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#3a3d44;overflow:hidden}#c{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "@pixiv/three-vrm": "/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const qs = new URLSearchParams(location.search);
const W = parseInt(qs.get('w') || '520');
const H = parseInt(qs.get('h') || '840');
const mode = qs.get('mode') || 'body';
const vrmUrl = qs.get('vrm') || '/assets/avatar.vrm';

try {
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setSize(W, H);
  renderer.domElement.id = 'c';
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x3a3d44);
  const fov = 22;
  const camera = new THREE.PerspectiveCamera(fov, W / H, 0.1, 20);

  // EXACT companion lights
  const keyLight = new THREE.DirectionalLight(0xfff1e0, 2.6);
  keyLight.position.set(0.6, 1.8, 1.2);
  scene.add(keyLight);
  scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x444466, 1.1));

  const loader = new GLTFLoader();
  loader.register((p) => new VRMLoaderPlugin(p));
  const gltf = await loader.loadAsync(vrmUrl);
  const vrm = gltf.userData.vrm;
  VRMUtils.removeUnnecessaryVertices(gltf.scene);
  VRMUtils.combineSkeletons(gltf.scene);
  scene.add(vrm.scene);

  const pose = [['leftUpperArm', -1.15], ['rightUpperArm', 1.15], ['leftLowerArm', -0.2], ['rightLowerArm', 0.2]];
  for (const [b, rz] of pose) { const n = vrm.humanoid?.getNormalizedBoneNode(b); if (n) n.rotation.z = rz; }

  vrm.scene.updateMatrixWorld(true);
  const v = new THREE.Vector3();
  const head = vrm.humanoid?.getNormalizedBoneNode('head');
  const hips = vrm.humanoid?.getNormalizedBoneNode('hips');
  if (head && hips) {
    const headY = head.getWorldPosition(v).y, hipsY = hips.getWorldPosition(v).y;
    let topY, bottomY;
    if (mode === 'face') { topY = headY + 0.16; bottomY = headY - 0.30; }
    else { topY = headY + 0.13 + 0.12; bottomY = hipsY - 0.02; }
    const targetY = (topY + bottomY) / 2, span = topY - bottomY;
    const dist = (span / 2) / Math.tan(THREE.MathUtils.degToRad(fov) / 2);
    camera.position.set(0, targetY, dist); camera.lookAt(0, targetY, 0);
  } else {
    camera.position.set(0, 1.25, 1.6); camera.lookAt(0, 1.15, 0);
    window.__warn = 'no humanoid head/hips';
  }
  const exprArg = qs.get('expr');
  if (exprArg && vrm.expressionManager) {
    for (const pair of exprArg.split(',')) {
      const [name, val] = pair.split(':');
      vrm.expressionManager.setValue(name, parseFloat(val ?? '1'));
    }
  }
  for (let i = 0; i < 6; i++) vrm.update(0.016);
  renderer.render(scene, camera);
  window.__renderDone = true;
} catch (e) {
  window.__renderError = String(e && e.stack || e);
  document.body.innerHTML = '<pre style="color:#fff">' + window.__renderError + '</pre>';
  window.__renderDone = true;
}
</script>
</body>
</html>
